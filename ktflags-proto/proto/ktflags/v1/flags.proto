syntax = "proto3";

// Sets the RPC route: /api/ktflags.v1.Flags/Evaluate
package ktflags.v1;

// REQUIRED. protoc-gen-kt takes the Kotlin package from java_package, NOT from `package` above.
// Omitting it yields an empty Kotlin package and unusable output.
option java_package = "com.latenighthack.ktflags.proto.v1";

// ---------------------------------------------------------------------------------------------
// ktbuf constraints that shaped this file, in order of how badly they bite:
//
//   * NO map<K,V>          -- protoc-gen-kt emits an EMPTY encode/decode branch for map fields, so
//                             they silently never serialize. Every key/value pair here is a
//                             `repeated <Entry>` message. ContextEntryWireTest guards this.
//   * NO `optional`        -- the generator rejects the whole file. Absence is modelled as the
//                             empty string, a missing repeated entry, or a dedicated RPC
//                             (ClearOverride), never as field presence.
//   * NO google/protobuf/* -- no well-known types, no Any. Timestamps are int64 `*_millis`, and
//                             every request carries at least one field so no Empty is needed.
//   * NO client streaming  -- generates code that does not compile. Everything here is unary,
//                             which also means the host app never needs install(WebSockets).
//   * enums -> sealed class, not a Kotlin enum. Every `when` over one needs an `else`, which is
//     why the runtime maps them to real Kotlin enums at a single boundary (FlagProtoMapping.kt).
//   * oneof -> hoisted to the FIRST constructor parameter of the generated data class.
//
// One file, deliberately: a second file sharing this java_package would make the generator emit
// a self-import, which is an untested corner of a generator with known sharp edges.
// ---------------------------------------------------------------------------------------------

enum FlagScope {
    FLAG_SCOPE_UNSPECIFIED = 0;
    FLAG_SCOPE_SERVICE = 1;
    FLAG_SCOPE_USER = 2;
    FLAG_SCOPE_CONTEXT = 3;
}

enum FlagType {
    FLAG_TYPE_UNSPECIFIED = 0;
    FLAG_TYPE_BOOL = 1;
    FLAG_TYPE_STRING = 2;
    FLAG_TYPE_INT = 3;
    FLAG_TYPE_DOUBLE = 4;
}

// Which layer of the resolution chain produced a value. Returned on every assignment so the
// client and the admin panel can tell "personalized" from "rolled out" from "never touched".
enum ValueSource {
    VALUE_SOURCE_UNSPECIFIED = 0;
    VALUE_SOURCE_CODE_DEFAULT = 1;
    VALUE_SOURCE_SERVICE_DEFAULT = 2;
    VALUE_SOURCE_SUBJECT_OVERRIDE = 3;
}

// A oneof is safe here, and that is load-bearing rather than incidental: the generated encoder
// writes the selected case UNCONDITIONALLY (proto3 default suppression is emitted only for
// singular fields, never inside a oneof), so bool_value=false / int_value=0 / string_value=""
// round-trip as PRESENT. A flag system that cannot express "explicitly false" is broken.
// Verified against ktbuf's own conformance.encoder.kt; FlagValueWireTest locks it in permanently.
//
// int_value is int64 for headroom if Long is ever added to the supported types. The runtime
// narrows to Kotlin Int and rejects out-of-range writes at one boundary.
message FlagValue {
    oneof value {
        bool bool_value = 1;
        string string_value = 2;
        int64 int_value = 3;
        double double_value = 4;
    }
}

// The map<string,string> replacement for a caller's context dimensions.
message ContextEntry {
    string dimension = 1;   // e.g. "tenant"
    string key = 2;         // e.g. "acme"
}

// Addresses one stored row. Service-wide is {SERVICE, "", ""}; a user is {USER, "", "u-42"};
// a context key is {CONTEXT, "tenant", "acme"}. One addressing scheme for the wire, the
// repository and the admin JSON, so the three cannot disagree about what a row is.
message SubjectRef {
    FlagScope scope = 1;
    string dimension = 2;
    string key = 3;
}

message FlagDefinition {
    string key = 1;
    FlagScope scope = 2;
    FlagType type = 3;
    // Non-empty only when scope is FLAG_SCOPE_CONTEXT (the @ContextScoped("...") argument).
    string dimension = 4;
    // The compile-time default from the annotated data class. NOTE: singular message fields are
    // NULLABLE in generated Kotlin (`FlagValue? = null`); a null here is a malformed message and
    // the server answers INVALID_ARGUMENT rather than dereferencing it.
    FlagValue default_value = 5;
    string description = 6;
}

message FlagAssignment {
    string key = 1;
    FlagValue value = 2;
    ValueSource source = 3;
}

// One stored override row, as seen by admin tooling.
message FlagOverride {
    string flag_key = 1;
    SubjectRef subject = 2;
    FlagValue value = 3;
    int64 updated_at_millis = 4;
    string updated_by = 5;
}

// ---------------------------------------------------------------------------------------------
// Public service. Read-only, unary, mounted on the host application's own listener.
// ---------------------------------------------------------------------------------------------

message EvaluateRequest {
    string schema_name = 1;
    // "" means "no user". An empty user id is NOT an error -- a logged-out client still gets the
    // service-wide values.
    string user_id = 2;
    repeated ContextEntry context = 3;
    // Empty = every flag in the schema. Populated by admin/debug callers, and available to a
    // client that needs to keep a response under the ktbuf 8KB unary ceiling.
    repeated string keys = 4;
    // Conditional fetch. Set both together, and only when the cached snapshot was taken for the
    // SAME subject fingerprint -- a subject change makes the revision meaningless.
    //
    // has_known_revision exists because revision 0 is a real value (a store with no overrides in
    // it), so it cannot double as the "I have nothing" sentinel. Without this, a deployment that
    // has never set an override would re-send its whole payload on every single refresh.
    bool has_known_revision = 5;
    int64 known_revision = 6;
}

message EvaluateResponse {
    // proto3 default false means "assignments are populated".
    bool not_modified = 1;
    int64 revision = 2;
    int64 evaluated_at_millis = 3;
    repeated FlagAssignment assignments = 4;
}

message GetSchemaRequest {
    string schema_name = 1;
}

message GetSchemaResponse {
    string schema_name = 1;
    repeated FlagDefinition definitions = 2;
    int64 revision = 3;
}

// There is deliberately no Watch/stream RPC. A conditional Evaluate that changed nothing costs one
// small round trip, which is cheaper than owning a WebSocket lifecycle on five platforms.
service Flags {
    rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
    rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
}

// ---------------------------------------------------------------------------------------------
// Admin service. Mounted on the internal listener alongside the JSON + HTML panel. Both
// front-ends are thin adapters over one implementation, so they cannot drift.
//
// Auth is the `x-admin-token` header read from context.headers. It CANNOT come from
// context.extensions: serveAll drops its contextProcessor for unary methods, and
// toGrpcRequestContext hardcodes extensions to an empty map.
// ---------------------------------------------------------------------------------------------

message FlagStatus {
    FlagDefinition definition = 1;
    // Null in Kotlin when no service-wide row exists.
    FlagValue service_value = 2;
    int64 service_updated_at_millis = 3;
    string service_updated_by = 4;
    // How many non-service rows exist for this flag.
    int32 subject_override_count = 5;
}

message ListFlagsRequest {
    string schema_name = 1;
}

message ListFlagsResponse {
    string schema_name = 1;
    int64 revision = 2;
    repeated FlagStatus flags = 3;
    int32 orphan_count = 4;
}

message SetOverrideRequest {
    string schema_name = 1;
    string flag_key = 2;
    SubjectRef subject = 3;
    FlagValue value = 4;
    string updated_by = 5;
}

message SetOverrideResponse {
    int64 revision = 1;
}

// A distinct RPC rather than SetOverride(value = null): with no `optional` there is no way to say
// "unset" inside SetOverrideRequest.
message ClearOverrideRequest {
    string schema_name = 1;
    string flag_key = 2;
    SubjectRef subject = 3;
}

message ClearOverrideResponse {
    int64 revision = 1;
    bool removed = 2;
}

// One row of the admin panel's subject view.
message SubjectFlag {
    FlagDefinition definition = 1;
    // Fully resolved for this subject, through the same chain Evaluate uses.
    FlagValue effective_value = 2;
    ValueSource source = 3;
    // Whether a row exists addressed to exactly this subject.
    bool overridden = 4;
    // Whether this subject may own this flag at all (a user cannot own a service- or
    // context-scoped flag). Rendered read-only in the UI rather than hidden, so an operator can
    // still see the effective value.
    bool applicable = 5;
    int64 updated_at_millis = 6;
    string updated_by = 7;
}

message GetSubjectRequest {
    string schema_name = 1;
    SubjectRef subject = 2;
}

message GetSubjectResponse {
    SubjectRef subject = 1;
    int64 revision = 2;
    repeated SubjectFlag flags = 3;
}

// The repeated-entry form of map<string, FlagValue>.
message FlagValueEntry {
    string flag_key = 1;
    FlagValue value = 2;
}

message SetSubjectOverridesRequest {
    string schema_name = 1;
    SubjectRef subject = 2;
    repeated FlagValueEntry set = 3;
    repeated string clear = 4;
    string updated_by = 5;
}

message SetSubjectOverridesResponse {
    int64 revision = 1;
    int32 written = 2;
    int32 cleared = 3;
}

message ListSubjectsRequest {
    string schema_name = 1;
    FlagScope scope = 2;      // USER or CONTEXT
    string dimension = 3;     // "" for USER
    string key_prefix = 4;
    int32 limit = 5;          // <= 0 applies the server default
}

message ListSubjectsResponse {
    repeated SubjectRef subjects = 1;
}

// Rows whose flag_key is no longer in the schema, typically left behind by a renamed flag.
message ListOrphansRequest {
    string schema_name = 1;
}

message ListOrphansResponse {
    repeated FlagOverride overrides = 1;
}

message PurgeOrphansRequest {
    string schema_name = 1;
}

message PurgeOrphansResponse {
    int64 revision = 1;
    int32 purged = 2;
}

service FlagsAdmin {
    rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse);
    rpc SetOverride(SetOverrideRequest) returns (SetOverrideResponse);
    rpc ClearOverride(ClearOverrideRequest) returns (ClearOverrideResponse);
    rpc GetSubject(GetSubjectRequest) returns (GetSubjectResponse);
    rpc SetSubjectOverrides(SetSubjectOverridesRequest) returns (SetSubjectOverridesResponse);
    rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);
    rpc ListOrphans(ListOrphansRequest) returns (ListOrphansResponse);
    rpc PurgeOrphans(PurgeOrphansRequest) returns (PurgeOrphansResponse);
}

// ---------------------------------------------------------------------------------------------
// The client's on-disk cache. No service; this message is only ever written to a flat file.
// ---------------------------------------------------------------------------------------------

message FlagSnapshot {
    // Versioned so a format change is a discard, not a crash.
    int32 format_version = 1;
    string schema_name = 2;
    int64 revision = 3;
    int64 fetched_at_millis = 4;
    // Stable hash of (userId, sorted context pairs). Guards against replaying one user's flags to
    // another after a login switch.
    string subject_fingerprint = 5;
    repeated FlagAssignment assignments = 6;
}
