name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS, not ubuntu: an ubuntu runner silently skips every Apple target rather than failing.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # protoc-gen-kt is a Go binary and the only codegen prerequisite the build cannot resolve
      # from Maven (protoc itself comes from a pinned Maven artifact).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: ./scripts/bootstrap.sh
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ktbuf 1.1.8 is the first version with macOS targets and is not on Central yet.
      - uses: actions/checkout@v4
        with:
          repository: latenighthack/ktbuf
          path: .ktbuf
          continue-on-error: true
      - name: Publish ktbuf to mavenLocal
        continue-on-error: true
        run: |
          if [ -d .ktbuf ]; then
            cd .ktbuf && ./gradlew --no-daemon \
              :library:publishToMavenLocal :rpc:publishToMavenLocal \
              :server:publishToMavenLocal :test:publishToMavenLocal
          fi

      - uses: gradle/actions/setup-gradle@v4

      # Read the generated schema before anything else compiles it: a codegen regression is much
      # easier to diagnose here than three modules downstream.
      - run: ./gradlew :ktflags-proto:generateProto :demo-flags:kspCommonMainKotlinMetadata --stacktrace
      - run: find demo-flags/build/generated/ksp -name '*.kt' -exec cat {} +

      - run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
