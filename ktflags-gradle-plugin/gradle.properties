# An included build does not inherit the root gradle.properties, and the vanniktech plugin reads
# this POM metadata as Gradle properties, so it has to be repeated here.
#
# GROUP and VERSION_NAME are deliberately NOT repeated: build.gradle.kts reads them from
# ../gradle.properties so the plugin's version can never drift from the processor it resolves.
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true
RELEASE_SIGNING_ENABLED=true

POM_ARTIFACT_ID=ktflags-gradle-plugin
POM_NAME=KtFlags Gradle Plugin
POM_DESCRIPTION=Wires the ktflags KSP processor into a module declaring an @FeatureFlagSet data class.

POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/mproberts/ktflags

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/mproberts/ktflags
POM_SCM_CONNECTION=scm:git:git://github.com/mproberts/ktflags.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/mproberts/ktflags.git

POM_DEVELOPER_ID=mproberts
POM_DEVELOPER_NAME=Mike Roberts
POM_DEVELOPER_URL=https://github.com/mproberts
POM_DEVELOPER_EMAIL=mike@mpr.io
