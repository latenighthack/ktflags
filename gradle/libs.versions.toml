[versions]
kotlin = "2.3.10"
agp = "8.13.2"
coroutines = "1.9.0"
# KSP release aligned to Kotlin 2.3.10 (unified versioning tracks the Kotlin version).
ksp = "2.3.10"
mavenPublish = "0.30.0"

# ktbuf supplies the protobuf runtime and the RPC transport. 1.1.8 is the first version with
# macOS targets; it is not on Maven Central yet, so it must come from mavenLocal:
#   cd ../ktbuf && ./gradlew :library:publishToMavenLocal :rpc:publishToMavenLocal \
#                            :server:publishToMavenLocal :test:publishToMavenLocal
ktbuf = "1.1.8"

# 3.0.2 is pinned, not merely current. ktbuf-server's routing breaks on 3.3.x: unary request
# bodies over ~8KB truncate or hang. Bumping this is a breaking change for every consumer;
# WireLargeSchemaTest is the tripwire that catches it.
ktor = "3.0.2"

# protoc is resolved as a pinned Maven artifact so the build does not depend on a local install.
# The codegen plugin `protoc-gen-kt` is a Go binary and IS a local prerequisite -- see scripts/bootstrap.sh.
protoc = "4.33.0"

sqldelight = "2.0.2"
serializationJson = "1.10.0"

# Server-side JDBC stack. sqlite is the zero-config default; postgres is opt-in.
sqliteJdbc = "3.45.3.0"
postgresql = "42.7.4"
hikari = "5.1.0"
flyway = "10.20.1"
testcontainers = "1.21.3"
slf4jSimple = "2.0.16"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# KSP processor authoring
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

# ktbuf. library + rpc are KMP and must be exposed as `api` from any module holding generated
# types: generated messages extend ktbuf supertypes, and Kotlin rejects a public supertype from
# a non-exposed dependency. server + test are JVM only.
ktbuf-library = { module = "com.latenighthack.ktbuf:ktbuf-library", version.ref = "ktbuf" }
ktbuf-rpc = { module = "com.latenighthack.ktbuf:ktbuf-rpc", version.ref = "ktbuf" }
ktbuf-server = { module = "com.latenighthack.ktbuf:ktbuf-server", version.ref = "ktbuf" }
ktbuf-test = { module = "com.latenighthack.ktbuf:ktbuf-test", version.ref = "ktbuf" }

# Ktor. ktflags needs no websockets: every RPC is unary, and serveAll only reaches its
# webSocket() branches for streaming methods.
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-jdbc-driver = { module = "app.cash.sqldelight:jdbc-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# Dialects are compile-time only: they teach SQLDelight the SQL grammar to generate against.
sqldelight-dialect-sqlite = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqldelight-dialect-postgresql = { module = "app.cash.sqldelight:postgresql-dialect", version.ref = "sqldelight" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
# Without an SLF4J binding, Testcontainers' explanation of *why* it could not reach Docker is
# swallowed entirely, which turns a five-minute fix into an afternoon.
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimple" }

# Gradle plugin artifacts referenced from build-logic so the convention plugins can apply them by id.
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
plugin-mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
